app = "dropdir"
primary_region = "nrt"
kill_signal = "SIGINT"
kill_timeout = "5s"

[http_service]
  internal_port = 8089
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "dropdir_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
